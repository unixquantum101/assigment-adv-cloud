# Load balancer / reverse proxy.
# 127.0.0.11 is Docker's embedded DNS: it resolves a Swarm service name to its
# virtual IP (VIP), and the VIP spreads requests across all replicas.
# Using a variable in proxy_pass makes nginx resolve at request time, so it
# starts even if web/api are not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    add_header X-Served-By $hostname always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
    }

    location / {
        set $web_upstream http://web:5000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
    }
}
